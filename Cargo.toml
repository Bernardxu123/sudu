[package]
name = "sudu"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "素读 — 轻量中文 Markdown 阅读器"

[features]
default = ["backend-wgpu"]
backend-tiny = ["iced/tiny-skia"]
backend-wgpu = ["iced/wgpu"]

[dependencies]
iced = { version = "0.14", default-features = false, features = ["image-without-codecs", "advanced", "lazy", "crisp", "web-colors", "svg", "thread-pool"] }
iced_selection = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
open = "5"
pulldown-cmark = { version = "0.12", default-features = false }
rfd = { version = "0.18", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
